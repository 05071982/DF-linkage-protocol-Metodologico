name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/publish-wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync wiki/ folder to the repository wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki_repo
          rsync -a --delete --exclude '.git' wiki/ wiki_repo/
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Wiki already up to date" && exit 0
          git commit -m "Sync wiki from main (${GITHUB_SHA::7})"
          git push origin HEAD
